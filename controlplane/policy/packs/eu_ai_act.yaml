# Policy pack: EU AI Act
# Illustrative / synthetic. Thresholds are hand-set placeholders, NOT tuned against a
# labelled set - the cost-weighted optimizer owns those numbers (CLAUDE.md 3.4).
# Hot-reloadable: edit and save, controlplane.policy.engine picks it up on mtime change.
version: 1
pack_id: eu_ai_act
region: EU
regulation: "EU AI Act (Reg. (EU) 2024/1689)"
description: >
  Strict pack emphasising transparency (Art. 50 disclosure) and human oversight
  (Art. 14). Low risk appetite: prefer ANNOTATE/HOLD over silent pass, and require a
  human in the loop for irreversible actions.

defaults:
  risk_appetite: low
  latency_budget_ms: 800
  flag_budget_pct: 5.0
  fail_open: false
  escalate_at: 0.25          # composite risk that triggers Layer 1
  thresholds:
    hallucination: 0.35
    privacy: 0.35
    bias: 0.30               # Art. 10 - bias in high-risk systems
    safety: 0.30
    cost: 0.80

profiles:
  customer_support_chat:
    risk_appetite: medium
    latency_budget_ms: 150   # hard real-time: Layer 1 will usually be cut short
    flag_budget_pct: 3.0
    fail_open: true          # low blast radius -> degrade to Layer 0, log it
    default_blast_radius: ADVISORY
    thresholds:
      hallucination: 0.45
      privacy: 0.35
      bias: 0.35
      safety: 0.30
      cost: 0.85

  internal_copilot:
    risk_appetite: high
    latency_budget_ms: 800
    flag_budget_pct: 8.0
    fail_open: true
    default_blast_radius: INFORMATIONAL
    thresholds:
      hallucination: 0.60
      privacy: 0.50
      bias: 0.55
      safety: 0.45
      cost: 0.90

  decision_support:
    risk_appetite: very_low  # Annex III high-risk: human oversight mandatory
    latency_budget_ms: 5000
    flag_budget_pct: 15.0
    fail_open: false         # high blast radius -> fail closed
    default_blast_radius: IRREVERSIBLE
    thresholds:
      hallucination: 0.25
      privacy: 0.25
      bias: 0.20
      safety: 0.20
      cost: 0.95

# Policy hits force a verdict regardless of score (the "policy hit" matrix row).
rules:
  - id: EU-ART50-DISCLOSURE
    description: "Art. 50 - AI output must be disclosed as AI-generated."
    when: {label: safety, min_score: 0.30}
    action: REPAIR
    repairable: true

  - id: EU-ART14-OVERSIGHT
    description: "Art. 14 - irreversible high-risk action requires human oversight."
    when: {blast_radius: IRREVERSIBLE, min_composite: 0.25}
    action: BLOCK
    repairable: false

  - id: EU-GDPR-PII
    description: "Personal data in output without a lawful basis."
    when: {label: privacy, min_score: 0.60}
    action: REPAIR
    repairable: true

  - id: EU-ART10-BIAS
    description: "Art. 10 - discriminatory output in a high-risk context."
    when: {label: bias, min_score: 0.50}
    action: REPAIR
    repairable: true

mappings:
  nist_ai_rmf: [GOVERN-1.1, MAP-2.3, MEASURE-2.7, MANAGE-2.2]
  owasp_llm_top10: [LLM01, LLM02, LLM06, LLM09]
